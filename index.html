<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizael Tilos</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
 
  
  <style type="text/tailwindcss">
    @theme {
      
      /* COLOR ROOT */
      --color-primary: #C9A86A;      /* Accent, buttons, highlights */
      --color-background: #121212;   /* Main background */
      --color-text: #F5F3EE;         /* Main text */
      --color-surface: #1C1C1C;      /* Cards, secondary sections */
      --color-muted: #A7A7A7;        /* Secondary text, descriptions */

      /* FONT ROOT */
      --font-primary: "Manrope", sans-serif;    
      --font-secondary: "Inter", sans-serif;
      --font-accent: "Playfair Display", serif;
    }
  </style>
</head>

<body class="min-h-screen bg-background text-text">

  <!-- HEADER SECTION-->
  <header class="relative z-50 m-3">
    <nav class="flex items-center justify-between text-text">
      <a class="font-primary text-xs font-bold" href="">MIZAEL TILOS</a>

      <div class="relative">
        <!-- HAMBURGER ICON -->
        <input class="peer hidden" type="checkbox" id="menu-toggle">
        <label class="cursor-pointer text-text lg:hidden" for="menu-toggle">
          <i class="fa-solid fa-bars"></i>
        </label>

        <!-- NAV LINKS -->
        <div class="absolute right-0 top-7 hidden w-25 flex-col items-end gap-4 bg-surface p-5 peer-checked:flex lg:static lg:flex lg:w-auto lg:flex-row lg:items-center lg:gap-10 lg:bg-transparent lg:p-0">
          <a class="text-xs text-text transition-colors duration-1  hover:text-[var(--color-primary)] hover:underline" href="">DEVELOPER</a>
          <a class="text-xs text-text transition-colors duration-200 hover:text-[var(--color-primary)] hover:underline" href="">ACTOR</a>
          <a class="text-xs text-text transition-colors duration-200 hover:text-[var(--color-primary)] hover:underline" href="">MUSICIAN</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <main>
    <section class="relative overflow-hidden bg-background">

      <!-- DESKTOP HERO -->
      <div class="relative hidden min-h-[calc(100vh-60px)] md:block">

        <!-- DESKTOP PHOTO - FULL WIDTH -->
        <img class="absolute inset-0 h-full w-full object-cover [mask-image:linear-gradient(to_bottom,transparent_0%,black_18%,black_100%)] [-webkit-mask-image:linear-gradient(to_bottom,transparent_0%,black_18%,black_100%)]" 
        src="images/hero-photo-desktop-view.jpg" 
        alt="Mizael"
      >
        <!-- DESKTOP TEXT - ON TOP OF PHOTO -->
        <div class="relative z-10 flex min-h-[calc(100vh-60px)] items-center px-12">
          <div>
            <h1 class="font-primary text-6xl font-bold leading-[0.9] text-text">MIZAEL<br>TILOS</h1>
            <p class="mt-5 font-secondary text-xs tracking-[0.35em] text-text">WEB DEVELOPER & CREATIVE</p>
            <p class="mt-4 max-w-sm font-secondary text-sm leading-relaxed text-text">I build clean, responsive websites with a focus on thoughtful design and user experience.</p>
            <button class="mt-6 bg-[var(--color-primary)] px-5 py-3 font-secondary text-xs font-medium tracking-wider text-text transition-opacity duration-200 hover:opacity-80">VIEW MY WORK →</button>
          </div>
        </div>
      </div>

      <!-- MOBILE HERO -->
      <div class="block md:hidden">

        <!-- MOBILE CONTENT -->
        <div class="px-2 pt-6">
          <h1 class="font-primary text-5xl font-bold leading-[0.9]">MIZAEL<br>TILOS</h1>
          <p class="mt-3 font-secondary text-[10px] tracking-[0.35em] text-muted font-bold">WEB DEVELOPER & CREATIVE</p>
          <p class="mt-4 max-w-xs font-secondary text-sm leading-relaxed text-muted">I build clean, responsive websites with a focus on thoughtful design and user experience.</p>
          <button class="mt-5 bg-[var(--color-primary)] px-8 py-3 font-secondary text-[10px] font-medium tracking-wider text-text transition-opacity duration-200 hover:opacity-80">VIEW MY WORK →</button>
        </div>

        <!-- MOBILE PHOTO -->
        <div class="relative bg-background">
          <img class="block h-[300px] w-full object-cover object-top [mask-image:linear-gradient(to_bottom,transparent_0%,black_18%,black_100%)] [-webkit-mask-image:linear-gradient(to_bottom,transparent_0%,black_18%,black_100%)]" 
          src="images/hero-photo-mobile-view.jpg" 
          alt="Mizael">
        </div>

      </div>
    </section>

  </main>
  

</html>
